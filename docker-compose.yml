services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bill_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-tracker} -d ${POSTGRES_DB:-bill_tracker}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: npm run start:dev --workspace=api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/${POSTGRES_DB:-bill_tracker}?schema=public
      PORT: 3001
      DEMO_MODE: ${DEMO_MODE:-${NEXT_PUBLIC_DEMO_MODE:-false}}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AWS_PROFILE: thoorigai
      AWS_REGION: ap-south-1
      AWS_SDK_LOAD_CONFIG: "1"
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - ./api:/workspace/api
      - /workspace/node_modules
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-${DEMO_MODE:-false}}
    command: npm run dev --workspace=web -- --webpack --hostname 0.0.0.0
    env_file: .env
    environment:
      INTERNAL_API_URL: http://api:3001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-${DEMO_MODE:-false}}
    ports:
      - "80:3000"
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./web:/workspace/web
      - /workspace/node_modules
      - web_next:/workspace/web/.next
    depends_on:
      - api

volumes:
  postgres_data:
  web_next: