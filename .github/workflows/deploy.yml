name: CI/CD Pipeline - Bill Collection Tracker

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Lint
        run: npm run lint

      - name: Generate Prisma Client
        run: npm run db:generate --workspace=api

      - name: Run API Unit & Integration Tests
        run: npm test --workspace=api

      - name: Validate Production Build
        run: npm run build

  deploy:
    name: Deploy to EC2 Production
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        if: ${{ env.EC2_HOST != '' }}
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          envs: GITHUB_SHA
          script: |
            set -e
            APP_DIR="/opt/thoorigai-bill-tracker"
            if [ ! -d "$APP_DIR" ]; then
              APP_DIR="$HOME/thoorigai-bill-tracker"
            fi
            
            echo "==> Deploying to $APP_DIR on EC2..."
            cd "$APP_DIR"
            
            # Run production deploy script
            if [ -f "infra/scripts/deploy.sh" ]; then
              chmod +x infra/scripts/deploy.sh
              ./infra/scripts/deploy.sh
            else
              git fetch origin
              git checkout -f master || git checkout -f main
              git pull
              docker compose -f docker-compose.prod.yml pull || true
              docker compose -f docker-compose.prod.yml run --rm api npm run db:deploy --workspace=api
              docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            fi
            
            echo "==> Deployment verification complete."
